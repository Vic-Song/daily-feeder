name: Refresh news headlines
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_news.py
      - .github/workflows/update-news.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch dated headlines from official RSS feeds
        run: python3 scripts/update_news.py
      - name: Save feed and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh dated news headlines'
          git push origin HEAD:main
          gh api --method POST "repos/$REPOSITORY/pages/builds"
